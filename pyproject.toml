[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "balldna"
version = "0.1.0"
description = "Self-supervised NBA player-style similarity engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.42,<2",
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "plotly>=5.20,<7",
  "scikit-learn>=1.4,<2",
  "python-dotenv>=1.0,<2",
  "kaggle>=1.8,<2",
  "requests>=2.31,<3",
  "pyarrow>=15,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
