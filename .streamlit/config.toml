[theme]
primaryColor = "#FF6B35"
backgroundColor = "#F6F8FC"
secondaryBackgroundColor = "#E8EEF7"
textColor = "#152238"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "viewer"
showErrorDetails = false

[server]
enableCORS = true
enableStaticServing = true
enableXsrfProtection = true
